<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nera · Asistente de Requerimientos — {{ banco }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
            <path d="M12 2.5l2.6 5.9 6.4.6-4.8 4.3 1.4 6.2L12 16.9 6 19.5l1.4-6.2L2.6 9l6.4-.6L12 2.5z"
                  fill="currentColor"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Nera</h1>
          <p>Asistente de Requerimientos · {{ banco }}</p>
        </div>
      </div>
      <span class="pill"><span class="ping"></span>en línea</span>
    </header>

    <main id="chat" class="chat"></main>

    <div id="status" class="status"></div>

    <footer class="composer">
      <button id="mic" class="icon-btn mic" title="Grabar audio" aria-label="Grabar audio">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2.5" width="6" height="11" rx="3"/>
          <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
          <path d="M12 17.5V21M8.5 21h7"/>
        </svg>
      </button>
      <textarea id="input" rows="1" placeholder="Cuéntame tu idea o requerimiento…"></textarea>
      <button id="send" class="icon-btn send" title="Enviar" aria-label="Enviar">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12l16-8-6 16-3-6-7-2z"/>
        </svg>
      </button>
    </footer>
  </div>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
